<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding RSVP – Kulshresthas</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Great+Vibes&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fceee1;--gold:#b8863b;--line:#dcb87c;--crim:#b0125c;--pink:#f9d4cf;--cell:#fdebe3;--ink:#5b2a3a;--serif:'Cormorant Garamond','Palatino Linotype',Georgia,serif;
--bg2:#fbe3d9}
@media (prefers-color-scheme:dark){:root{--bg2:#fbe3d9}}
*{box-sizing:border-box;font-variant-numeric:lining-nums}
html,body{margin:0;min-height:100%;background:linear-gradient(#f6d9cf,#fbe9e1);font-family:var(--serif);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.card{container-type:inline-size;max-width:780px;margin:0 auto;background:var(--bg);box-shadow:0 0 40px rgba(150,70,60,.25);overflow:hidden}
.in{--s:.1172cqw;--t:max(13px,calc(var(--s)*19))}
.top{position:relative;aspect-ratio:853/215;background:var(--bg) var(--top) center/100% 100% no-repeat;text-align:center}
.top h1{position:absolute;left:0;right:0;top:28%;margin:0;font-weight:500;font-size:max(42px,calc(var(--s)*100));line-height:1;color:var(--gold);letter-spacing:.01em}
.top p{position:absolute;left:0;right:0;top:80%;margin:0;font-style:italic;font-weight:500;color:var(--crim);font-size:max(13px,calc(var(--s)*21))}
.body{position:relative;padding:calc(var(--s)*20) calc(var(--s)*50) 0;background-color:var(--bg);background-image:var(--pl),var(--pr);background-size:calc(var(--s)*46) auto,calc(var(--s)*46) auto;background-position:left top,right top;background-repeat:repeat-y,repeat-y}
.body:before,.body:after{content:"";position:absolute;bottom:max(80px,calc(var(--s)*100));width:calc(var(--s)*46);height:calc(var(--s)*240);background-size:100% 100%;pointer-events:none}
.body:before{left:0;background-image:var(--cl)}.body:after{right:0;background-image:var(--cr)}
.box{position:relative;border:1px solid var(--line);border-radius:calc(var(--s)*14);background:rgba(255,238,230,.55);padding:calc(var(--s)*36) calc(var(--s)*24) calc(var(--s)*14);margin-top:calc(var(--s)*34)}
.rib{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);white-space:nowrap;background:var(--pink);border:1px solid var(--line);padding:calc(var(--s)*6) calc(var(--s)*40);font-weight:600;letter-spacing:.04em;color:var(--crim);font-size:max(13px,calc(var(--s)*20));text-transform:uppercase;z-index:2;border-radius:3px}
.rib .fl{position:absolute;top:50%;width:calc(var(--s)*30);height:calc(var(--s)*30);min-width:20px;min-height:20px;transform:translateY(-50%)}
.rib .fl.l{left:max(-14px,calc(var(--s)*-15))}.rib .fl.r{right:max(-14px,calc(var(--s)*-15))}
.guest{margin:calc(var(--s)*36) calc(var(--s)*50) 0;padding:calc(var(--s)*26) calc(var(--s)*40) calc(var(--s)*16) calc(var(--s)*80);background-image:var(--sfl),var(--sfl);background-repeat:no-repeat;background-size:calc(var(--s)*44) calc(var(--s)*88),calc(var(--s)*44) calc(var(--s)*88);background-position:left calc(var(--s)*14) center,right calc(var(--s)*14) center;background-color:rgba(255,238,230,.55)}
.fld{display:flex;align-items:flex-end;gap:calc(var(--s)*14);margin-bottom:calc(var(--s)*14)}
.fld label{white-space:nowrap;font-weight:500;color:#4d2330;font-size:var(--t)}
.fld input{flex:1;min-width:0;border:0;border-bottom:1px solid #6a3a48;background:transparent;font:500 var(--t) var(--serif);color:var(--crim);padding:2px 4px;outline:0;border-radius:0;font-variant-numeric:lining-nums}
.fld input:focus,.cnt:focus{border-bottom-color:var(--crim);background:rgba(255,255,255,.4)}
.err{color:#c4182f;font-size:max(12px,calc(var(--s)*16));font-style:italic;margin:calc(var(--s)*-8) 0 calc(var(--s)*8)}
.tbl{padding:0;margin-top:calc(var(--s)*36)}
.tbl .rib{top:0}
.tr{display:grid;grid-template-columns:361fr 114fr 155fr 123fr;border-top:1px solid var(--line);align-items:stretch;font-size:var(--t)}
.tr>div{padding:calc(var(--s)*8);display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);background:var(--cell)}
.tr>div:first-child{border-left:0;justify-content:flex-start}
.th>div:first-child{justify-content:center;border-top-left-radius:calc(var(--s)*14)}.th>div:last-child{border-top-right-radius:calc(var(--s)*14)}.th>div{background:#f9d8d0;color:var(--crim);font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:max(10px,calc(var(--s)*15));text-align:center;padding:calc(var(--s)*14) 4px}
.tbl .th{margin-top:calc(var(--s)*24)}
.ce{gap:calc(var(--s)*16)}
.ce img,.rib .fl{mix-blend-mode:multiply}.ce img{width:calc(var(--s)*80);min-width:44px;height:auto;flex:none}
.ce b{display:block;color:var(--crim);font-weight:700;font-size:max(12px,calc(var(--s)*20));line-height:1.15}
.ce span{color:#4d2330;font-weight:500;font-size:max(12px,calc(var(--s)*19))}
.ce sup{font-size:.6em}
.tr:not(.th)>div{min-height:calc(var(--s)*75)}
.cb{position:relative;display:inline-block;cursor:pointer}
.cb input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.cb i{display:block;width:max(22px,calc(var(--s)*27));height:max(22px,calc(var(--s)*27));border:1.5px solid var(--crim);background:#fff3ee;border-radius:2px;transition:.15s}
.cb input:checked+i{background:var(--crim)}
.cb input:checked+i:after{content:"";display:block;width:35%;height:62%;margin:6% auto 0;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.cb input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
.cnt{width:70%;min-width:44px;border:0;border-bottom:1px solid var(--crim);background:transparent;text-align:center;font:600 var(--t) var(--serif);color:var(--crim);outline:0;padding:2px;border-radius:0;font-variant-numeric:lining-nums}
.cnt:disabled{opacity:.35;cursor:not-allowed}
.rowerr{padding:2px calc(var(--s)*16);background:var(--cell);border-top:1px dashed var(--line)}
.rowerr .err{margin:2px 0}
.vr{display:grid;grid-template-columns:290fr 447fr;gap:calc(var(--s)*13);margin-top:calc(var(--s)*8)}
.vr .box{text-align:center;padding-top:calc(var(--s)*40);margin-top:calc(var(--s)*28)}
.vr .box>div{margin:0 auto}
.pin{width:max(16px,calc(var(--s)*22));height:auto;display:block;margin:calc(var(--s)*-4) auto 2px}
.vn{font-weight:700;color:var(--crim);font-size:max(13px,calc(var(--s)*19))}
.va{font-weight:500;color:#4d2330;font-size:max(12px,calc(var(--s)*17));line-height:1.3}
.qr{width:calc(var(--s)*100);min-width:70px;height:auto;display:block;margin:calc(var(--s)*10) auto 4px;border-radius:50%}
.acc p{margin:0 0 calc(var(--s)*14);font-style:italic;font-weight:500;color:var(--crim);font-size:max(12px,calc(var(--s)*18.5));line-height:1.3}
.acc .ap{margin-top:calc(var(--s)*12)}.acc .ni{margin-top:calc(var(--s)*6);text-align:left}.acc .opt{display:flex;gap:calc(var(--s)*14);flex-wrap:wrap;font-weight:500;color:#4d2330;font-size:max(11px,calc(var(--s)*16))}.acc .opt label{display:flex;align-items:center;gap:6px}.acc .opt .cb i{width:max(16px,calc(var(--s)*19));height:max(16px,calc(var(--s)*19))}.acc .ci{font-weight:600;color:var(--crim);font-size:max(12px,calc(var(--s)*18));font-style:normal;line-height:1.5}
.sub{text-align:center;height:max(80px,calc(var(--s)*100));padding-top:calc(var(--s)*28)}
.btn{font:700 max(15px,calc(var(--s)*22)) var(--serif);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:linear-gradient(#c21a6c,#9f0f55);border:2px solid var(--gold);padding:calc(var(--s)*14) calc(var(--s)*50);border-radius:40px;cursor:pointer;box-shadow:0 4px 14px rgba(160,15,85,.3);min-height:44px}
.btn:hover{filter:brightness(1.08)}
.foot{position:relative;text-align:center;background:var(--bg) var(--foot) bottom center/100% auto no-repeat;min-height:calc(var(--s)*338);padding:calc(var(--s)*12) 12px calc(var(--s)*128)}
.rw{position:relative;display:inline-block;margin:0 auto}
.rw .rib{position:relative;left:auto;top:auto;transform:none;display:inline-block}
.foot p{margin:0;font-style:italic;font-weight:500;color:#4d2330;font-size:max(12px,calc(var(--s)*17))}
.tel{display:flex;justify-content:center;align-items:center;gap:calc(var(--s)*14);margin:calc(var(--s)*4) 0 calc(var(--s)*8);flex-wrap:wrap}
.tel a{color:var(--crim);font-family:'Montserrat','Poppins','Segoe UI',Arial,sans-serif;font-weight:600;text-decoration:none;font-size:max(15px,calc(var(--s)*21.5));letter-spacing:.02em}
.tel svg{width:max(20px,calc(var(--s)*26));height:max(20px,calc(var(--s)*26));background:var(--crim);border-radius:50%;padding:max(4px,calc(var(--s)*5));fill:#fff}
.foot .r2{margin:calc(var(--s)*6) 0 calc(var(--s)*10)}
.foot .r2 .rib{font-size:max(12px,calc(var(--s)*19));text-transform:none;letter-spacing:.02em;padding:calc(var(--s)*6) calc(var(--s)*30)}
.wl{font-style:normal!important;font-weight:600!important;color:#4d2330!important;font-size:max(13px,calc(var(--s)*19))!important}
.sig{font-family:'Great Vibes',cursive;color:var(--crim);font-size:max(32px,calc(var(--s)*50));line-height:1;margin-top:0}
.ok{margin-top:calc(var(--s)*36);text-align:center;padding:calc(var(--s)*40) calc(var(--s)*30)}
.ok h2{margin:0 0 8px;font:600 max(28px,calc(var(--s)*46)) var(--serif);color:var(--gold)}
.ok p{font-size:max(15px,calc(var(--s)*22));margin:8px 0;font-style:italic;color:var(--crim);font-weight:500}
.ok .sm{font-style:normal;color:#4d2330;font-size:max(14px,calc(var(--s)*19))}
.ok a,.ok button{display:inline-block;margin:10px 6px 0;font:600 max(14px,calc(var(--s)*19)) var(--serif);padding:10px 22px;border-radius:30px;border:1.5px solid var(--crim);color:var(--crim);background:#fff3ee;text-decoration:none;cursor:pointer}
.ok a.wa{background:var(--crim);color:#fff}
.noscript{padding:30px;text-align:center}
@container (max-width:560px){.foot{background-size:720px auto;min-height:284px;padding-bottom:110px}.top p{top:77%}}
</style></head>
